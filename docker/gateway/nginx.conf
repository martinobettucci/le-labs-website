# =============================================================================
# Supabase API gateway — single origin (:8000) fanning out to the lean stack.
# Trailing slashes on both `location` and `proxy_pass` strip the public prefix
# (e.g. /auth/v1/token -> auth:9999/token), matching real Supabase routing.
#
# The browser never calls this gateway cross-origin (the web apps reverse-proxy
# /supabase -> gateway, same-origin). The permissive CORS block below only
# exists so the gateway can also be hit directly (host port, debugging, curl).
# =============================================================================

map $request_method $is_preflight {
    OPTIONS 1;
    default 0;
}

server {
    listen 8000;
    server_name _;
    client_max_body_size 50M;

    # --- shared CORS (reflect origin; harmless for the same-origin app path) ---
    add_header Access-Control-Allow-Origin  $http_origin always;
    add_header Access-Control-Allow-Credentials true always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, apikey, Content-Type, Accept, Accept-Profile, Content-Profile, X-Client-Info, X-Upsert, Prefer, Range, X-Requested-With, Cache-Control, X-Supabase-Api-Version" always;
    add_header Access-Control-Expose-Headers "Content-Range, Content-Length, Content-Encoding, ETag, Location" always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location /auth/v1/ {
        if ($is_preflight) { return 204; }
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_pass http://auth:9999/;
    }

    location /rest/v1/ {
        if ($is_preflight) { return 204; }
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_pass http://rest:3000/;
    }

    location /storage/v1/ {
        if ($is_preflight) { return 204; }
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_pass http://storage:5000/;
    }
}
